databases:
  - name: codearena-db
    databaseName: codearena
    user: codearena
    plan: free

services:
  - type: web
    name: codearena-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run prisma:generate --workspace backend && npx prisma migrate deploy --schema backend/prisma/schema.prisma && npm run db:seed --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: codearena-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
